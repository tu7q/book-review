<article class="entry">
  <h2>{{ page.fm.title }}</h2>
  <div class="context">
    <p>By <strong>{{page.fm.author}}</strong>
    </p>
  </div>
  <div class="content">
    {{ page.content }}
  </div>
  <div class="meta">
    <p>{{ page.fm.created.strftime('%d %b %Y') }} — <strong>{{ page.fm.reader }}</strong></p>
    <span class="edit"><a href="{{ getEditUrl(config.site.repo, page) }}">edit</a></span>
  </div>
</article>
